  </defs>
  <rect width="512" height="512" fill="#f6f7fb"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <rect x="150" width="8" height="512" fill="#cf4a3e" fill-opacity=".8"/>
  <path d="M346 132c-8-30-58-34-66 14l-38 224c-8 46-56 42-66 14" fill="none" stroke="#1a2132" stroke-width="30" stroke-linecap="round"/>
  <circle cx="346" cy="132" r="22" fill="#1a2132"/>
